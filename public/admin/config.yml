backend:
  name: github
  repo: jackverstappen/ziektealswerk          # pas aan naar de echte repo
  branch: main
  base_url: https://sveltia-cms-auth.jack-verstappen.workers.dev   # de Sveltia-inlogworker op Cloudflare


media_folder: "public/media"
public_folder: "/media"
locale: nl
publish_mode: simple

app_title: Ziekte ⇔ Werk - Admin
logo:
  src: /icon-512.png
  show_in_header: true

collections:
  - name: nummers
    label: "Publicaties"
    label_singular: "Nummer"
    folder: "src/content/nummers"
    create: true
    slug: "{{nummer}}"
    summary: "Nummer {{nummer}} — {{titel}}"
    fields:
      - { name: nummer, label: "Nummernummer", widget: number, value_type: int, min: 0, required: false, hint: "0, 1, 2, 3 … Altijd invullen. Dit staat in de gedrukte QR-codes en verandert nooit meer." }
      - { name: titel, label: "Titel", widget: string }
      - { name: ondertitel, label: "Ondertitel", widget: string, required: false }
      - { name: jaar, label: "Jaar", widget: number, value_type: int }
      - { name: paginas, label: "Aantal pagina's", widget: number, value_type: int }
      - { name: status, label: "Status", widget: select, options: ["Nieuw", "Te bestellen", "Uitverkocht in print", "In de maak"] }
      - { name: verschenen, label: "Verschenen op", widget: datetime, time_format: false, picker_utc: false }
      - { name: omslag, label: "Omslag (afbeelding)", widget: image, media_folder: "/public/omslag", public_folder: "/omslag" }
      - { name: pdf, label: "PDF van het nummer", widget: string, hint: "Volledig adres van de PDF op R2, bijvoorbeeld https://audio.ziekte-werk.nl/pdf/nummer-2.pdf — grote bestanden kunnen niet hier geüpload worden. De pagina's worden hier automatisch uit gehaald." }
      - name: artikelen
        label: "Artikelen"
        widget: list
        required: false
        label_singular: "Artikel"
        summary: "{{fields.n}} — {{fields.titel}}"
        hint: "Alleen invullen als er losse artikelen ontsloten worden. Leeg laten mag — dan krijgt dit nummer geen luisterpagina en geen QR-codes."
        fields:
          - { name: n, label: "Volgnummer", widget: string, pattern: ['^\d{2}$', "Twee cijfers, bijvoorbeeld 07"], hint: "Staat in de gedrukte QR-code. Nooit meer wijzigen." }
          - { name: titel, label: "Titel", widget: string }
          - { name: auteur, label: "Auteur", widget: string }
          - { name: lezer, label: "Ingesproken door", widget: string, required: false }
          - { name: samenvatting, label: "Korte samenvatting", widget: text, hint: "Twee regels. Dit staat in de podcast-apps." }
          - { name: audio, label: "Link naar de m4a/mp3", widget: string, required: false, hint: "Volledige URL, bijvoorbeeld van Internet Archive. Niet hier uploaden — m4a/mp3's zijn te groot voor de site." }
          - { name: duur, label: "Duur in seconden", widget: number, value_type: int, required: false }
          - { name: bytes, label: "Bestandsgrootte in bytes", widget: number, value_type: int, required: false, hint: "Rechtsklik het bestand → Info. Podcast-apps vragen erom." }
          - { name: transcript, label: "Transcript", widget: text, required: false, hint: "Wordt de leesmodus voor wie niet kan luisteren of het beeld niet kan zien." }
      - { name: body, label: "Inleiding", widget: markdown, required: false }

  - name: events
    label: "Agenda"
    label_singular: "Bijeenkomst"
    folder: "src/content/events"
    create: true
    identifier_field: titel
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{datum | date('YYYY-MM-DD')}} — {{titel}}"    
    sortable_fields: [datum]
    fields:
      - { name: titel, label: "Titel", widget: string }
      - { name: datum, label: "Datum en tijd", widget: datetime, picker_utc: false, format: "YYYY-MM-DDTHH:mm:ssZ" }
      - { name: eindtijd, label: "Eindtijd", widget: datetime, picker_utc: false, required: false, format: "YYYY-MM-DDTHH:mm:ssZ" }
      - { name: plaats, label: "Plaats", widget: string }
      - { name: soort, label: "Soort", widget: select, options: ["Leesgroep", "Presentatie", "Werksessie", "Gesprek", "Tentoonstelling"] }
      - { name: aanmelden, label: "Aanmeldlink of e-mail", widget: string, required: false }
      - { name: body, label: "Toelichting", widget: markdown, required: false }

  - name: nieuws
    label: "Nieuws"
    label_singular: "Bericht"
    folder: "src/content/nieuws"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: [datum]
    fields:
      - { name: titel, label: "Titel", widget: string }
      - { name: datum, label: "Datum", widget: datetime, time_format: false, picker_utc: false }
      - { name: soort, label: "Soort", widget: select, options: ["Aankondiging", "Open oproep", "Pers"] }
      - { name: bron, label: "Bron (bij pers)", widget: string, required: false }
      - { name: body, label: "Tekst", widget: markdown }

# Vaste teksten op de startpagina. Geen lijst, maar twee losse formulieren.
  - name: vaste_teksten
    label: "Vaste teksten"
    files:
      - name: over
        label: "Over ons"
        file: "src/content/pagina/over.md"
        fields:
          - { name: titel, label: "Kop", widget: string, hint: "De grote vraag boven de tekst." }
          - { name: body, label: "Tekst", widget: markdown, hint: "Wordt over twee kolommen verdeeld op een breed scherm." }
          - { name: foto, label: "Foto", widget: image, required: false, media_folder: "/public/media", public_folder: "/media" }
          - { name: fotobijschrift, label: "Bijschrift bij de foto", widget: string, required: false }

      - name: contact
        label: "Contact"
        file: "src/content/pagina/contact.md"
        fields:
          - { name: titel, label: "Kop", widget: string }
          - { name: body, label: "Tekst", widget: markdown, hint: "Zet het e-mailadres als losse alinea met een link erop — dan wordt het groot getoond." }
          - { name: formulier, label: "Adres van het contactformulier", widget: string, required: false, hint: "Van Formspree of Web3Forms. Leeg laten = geen formulier, alleen de tekst." }
